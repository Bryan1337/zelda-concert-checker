name: Zelda London Ticket Watch

on:
  schedule:
    # GitHub cron uses UTC. Check six times per hour.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test notification instead of checking the page"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# A delayed scheduled run should not overlap the next one.
concurrency:
  group: zelda-london-ticket-watch
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("Missing repository secret: DISCORD_WEBHOOK_URL")

          payload = {
              "content": (
                  "TEST: **Zelda London ticket monitor**\n"
                  "GitHub Actions -> Discord is working.\n"
                  "https://zelda.gameconcerts.com/"
              )
          }
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": (
                      "DiscordBot "
                      "(https://github.com/Bryan1337/zelda-concert-checker, 1.0)"
                  ),
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print("Discord status:", response.status)
          PY

      - name: Check the two London listings
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        id: check
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          import time
          import urllib.request

          URL = "https://zelda.gameconcerts.com/"
          EXPECTED_CARDS = {
              "3 APR 2027": (
                  "7:30 pm London Symphony Orchestra Royal Albert Hall "
                  "on sale 30 Sep 2026"
              ),
              "4 APR 2027": (
                  "1:30 pm London Symphony Orchestra Royal Albert Hall "
                  "on sale 30 Sep 2026"
              ),
          }

          def fetch_page():
              last_error = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          URL,
                          headers={
                              "User-Agent": "Mozilla/5.0 ZeldaLondonTicketWatch/2.0",
                              "Accept": "text/html,application/xhtml+xml",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.read().decode("utf-8", errors="replace")
                  except Exception as error:
                      last_error = error
                      print(f"Fetch attempt {attempt}/3 failed: {error!r}")
                      if attempt < 3:
                          time.sleep(5 * attempt)
              raise last_error

          def visible_text(raw_html):
              raw_html = re.sub(r"(?is)<script\b.*?</script>", " ", raw_html)
              raw_html = re.sub(r"(?is)<style\b.*?</style>", " ", raw_html)
              raw_html = re.sub(r"(?s)<[^>]+>", " ", raw_html)
              return re.sub(r"\s+", " ", html.unescape(raw_html)).strip()

          def extract(text, date, next_listing):
              pattern = (
                  rf"\bUK\s+LONDON\s+{re.escape(date)}\b"
                  rf"(.*?)"
                  rf"(?=\b{next_listing}\b)"
              )
              match = re.search(pattern, text, re.IGNORECASE)
              return match.group(1).strip() if match else None
          try:
              text = visible_text(fetch_page())
              cards = {
                  "3 APR 2027": extract(
                      text,
                      "3 APR 2027",
                      r"UK\s+LONDON\s+4\s+APR\s+2027",
                  ),
                  "4 APR 2027": extract(
                      text,
                      "4 APR 2027",
                      r"AUS\s+MELBOURNE",
                  ),
              }

              missing = [date for date, details in cards.items() if details is None]
              if missing:
                  state = (
                      "PAGE STRUCTURE CHANGED: could not locate the London listing(s) for "
                      + ", ".join(missing)
                  )
                  result = "structure_changed"
              else:
                  state = "\n".join(
                      f"London {date}: {details}" for date, details in cards.items()
                  )
                  # Compare the complete visible text of both cards. This also catches
                  # a Buy Tickets button being added while the placeholder remains.
                  unchanged = all(
                      details.casefold() == EXPECTED_CARDS[date].casefold()
                      for date, details in cards.items()
                  )
                  result = "placeholder_unchanged" if unchanged else "ticket_text_changed"
          except Exception as error:
              # Treat loss of visibility as alert-worthy rather than silently going blind.
              print(f"Page check failed after retries: {error!r}")
              state = (
                  "MONITOR ERROR: unable to fetch the concert page after three attempts "
                  f"({type(error).__name__})."
              )
              result = "monitor_error"

          changed = result != "placeholder_unchanged"
          print(state)
          print("Result:", result)

          with open("london-state.txt", "w", encoding="utf-8") as state_file:
              state_file.write(state + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
              output.write(f"result={result}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Zelda London ticket check\n\n")
              summary.write(f"Result: `{result}`\n\n")
              summary.write("```text\n" + state[:4000] + "\n```\n")
          PY

      # The observed state is part of the key. This suppresses repeat alerts for the
      # same changed text but allows another alert if the ticket text changes again.
      - name: Check whether this state was already reported
        if: ${{ steps.check.outputs.changed == 'true' }}
        id: alert_cache
        uses: actions/cache/restore@v4
        with:
          path: .alert-marker
          key: zelda-london-alert-${{ hashFiles('london-state.txt') }}
      - name: Send London ticket alert
        if: ${{ steps.check.outputs.changed == 'true' && steps.alert_cache.outputs.cache-hit != 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECK_RESULT: ${{ steps.check.outputs.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("Missing repository secret: DISCORD_WEBHOOK_URL")

          with open("london-state.txt", encoding="utf-8") as state_file:
              state = state_file.read().strip()

          result = os.environ["CHECK_RESULT"]
          if result == "ticket_text_changed":
              reason = (
                  "Visible text changed in at least one London listing. The "
                  "`on sale 30 Sep 2026` placeholder may have been replaced "
                  "or a ticket button may have appeared."
              )
          elif result == "structure_changed":
              reason = "The page structure changed, so the London listings need checking."
          else:
              reason = "The monitor could not read the page after three attempts."

          message = (
              "**ZELDA LONDON TICKET ALERT**\n"
              f"{reason}\n\n"
              f"{state[:1200]}\n\n"
              "Check now: https://zelda.gameconcerts.com/"
          )
          request = urllib.request.Request(
              webhook,
              data=json.dumps({"content": message}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": (
                      "DiscordBot "
                      "(https://github.com/Bryan1337/zelda-concert-checker, 1.0)"
                  ),
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Discord status:", response.status)
          PY

      - name: Create alert marker
        if: ${{ steps.check.outputs.changed == 'true' && steps.alert_cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .alert-marker
          date -u > .alert-marker/sent-at.txt

      - name: Remember this reported state
        if: ${{ steps.check.outputs.changed == 'true' && steps.alert_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .alert-marker
          key: zelda-london-alert-${{ hashFiles('london-state.txt') }}
